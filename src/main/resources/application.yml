## ---------------------------------------------------------------------------------------------
## Centinela - configuración base
##
## 12-Factor: la configuración vive en el entorno. Aquí sólo hay estructura y valores por
## defecto aptos para desarrollo; todo lo que cambia entre despliegues se resuelve por variable
## de entorno.
##
## NINGÚN SECRETO EN ESTE FICHERO. Contraseñas y credenciales entran siempre por variable de
## entorno, y en AWS las inyecta Secrets Manager a través del task definition.
##
## Sobre las credenciales de AWS: el SDK usa su cadena por defecto, que ya lee
## AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN del entorno sin que haya que
## configurar nada. En producción NO se usan: allí el proveedor correcto es el rol de la tarea
## (IRSA en EKS, task role en ECS), que rota las credenciales solo y no deja secretos de larga
## duración en ninguna parte. Ver application-prod.yml.
##
## Perfiles: 'local' (docker compose) y 'prod'.
## ---------------------------------------------------------------------------------------------

spring:
  application:
    name: centinela

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  main:
    banner-mode: "off"

  mvc:
    problemdetails:
      # Hace que también las excepciones propias de Spring MVC (405, 415, cuerpo ilegible...)
      # salgan como Problem Details. Sin esto convivirían dos formatos de error en la misma API.
      enabled: true

  threads:
    virtual:
      # El motor es masivamente concurrente y sus operaciones son de E/S (DynamoDB,
      # ElastiCache, Kafka). Con virtual threads cada evaluación puede bloquear sin coste:
      # desaparece la necesidad de un pool dimensionado a mano y de código reactivo.
      # Requiere que ninguna ruta caliente use synchronized sobre E/S; desde JDK 24 (JEP 491)
      # ni siquiera eso fija el hilo portador.
      enabled: true

  lifecycle:
    # Margen para terminar las evaluaciones en vuelo antes de cerrar. Debe ser mayor que el
    # presupuesto de latencia del motor y menor que el grace period del orquestador.
    timeout-per-shutdown-phase: 25s

  # ============================================================================================
  # Kafka
  # ============================================================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${spring.application.name}

    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      metadata.max.age.ms: 180000

    consumer:
      group-id: ${KAFKA_GROUP_ID:centinela-evaluador}
      # 'latest' y no 'earliest': si el motor estuvo caído, reevaluar autorizaciones de hace
      # horas no aporta nada (ya se resolvieron) y sí crea una avalancha de decisiones tardías.
      # La reevaluación histórica es un proceso aparte y deliberado.
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:latest}
      enable-auto-commit: false
      isolation-level: read_committed
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer envuelve al delegado: un mensaje corrupto se convierte en un
      # registro con cabecera de error en vez de matar el contenedor en un bucle infinito.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # JacksonJson*, no Json*: Spring Boot 4 trae Jackson 3 (tools.jackson) y las clases
        # JsonDeserializer/JsonSerializer de spring-kafka siguen atadas a Jackson 2, que aquí
        # sólo está en el classpath de test. Usarlas reventaría en runtime.
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        # Sin cabeceras de tipo: el productor es un sistema externo que no las escribe, y
        # confiar en un tipo que viene en el mensaje sería una superficie de ataque.
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.centinela.fraude.infraestructura.adaptador.entrada.contrato.TransaccionEvento
        spring.json.trusted.packages: com.centinela.fraude.infraestructura.adaptador.entrada.contrato
        # Debe superar con holgura (presupuesto de latencia x max-poll-records) o el consumidor
        # se expulsa del grupo justo cuando más carga hay.
        max.poll.interval.ms: 60000
        session.timeout.ms: 30000
        heartbeat.interval.ms: 3000

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # ------------------------------------------------------------------------------------
        # gzip y no zstd. zstd, lz4 y snappy son bibliotecas JNI: cargan un .so desde el propio
        # jar en tiempo de ejecución, y en una imagen nativa ese recurso no está incluido salvo
        # que se añada a mano (kafka-clients no trae metadata de native-image). gzip usa
        # java.util.zip, que es del JDK y funciona igual compilado.
        #
        # El coste es un ratio de compresión peor sobre mensajes que son JSON pequeño. Si se
        # ejecuta sobre la JVM, KAFKA_COMPRESSION=zstd lo cambia sin tocar código.
        # ------------------------------------------------------------------------------------
        compression.type: ${KAFKA_COMPRESSION:gzip}
        # 5 ms de espera agrupan lotes sin comprometer el presupuesto de latencia.
        linger.ms: 5
        # Kafka EXIGE delivery.timeout.ms >= linger.ms + request.timeout.ms, y si no se cumple
        # el productor no se llega a construir: falla el primer envío, no el arranque. El valor
        # por defecto de request.timeout.ms son 30 s, así que hay que bajarlo explícitamente.
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        spring.json.add.type.headers: false

    listener:
      # Confirmación explícita tras evaluar y asentar: si el proceso cae a mitad, el mensaje
      # se reprocesa. Al-menos-una-vez con decisiones idempotentes por id de transacción.
      ack-mode: manual_immediate
      # Nunca por encima del número de particiones del topic: los consumidores sobrantes
      # quedarían ociosos.
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
      observation-enabled: true

  # ============================================================================================
  # ElastiCache (Valkey/Redis) - contadores de velocidad
  # ============================================================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Vacía en local; en AWS la inyecta Secrets Manager.
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      # Timeout agresivo a propósito: este acceso está dentro de la ventana de autorización.
      # Si la caché no responde en 80 ms, el motor degrada la señal de velocidad y sigue.
      timeout: ${REDIS_TIMEOUT:80ms}
      connect-timeout: 250ms
      client-type: lettuce
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX:32}
          max-idle: 16
          min-idle: 4
          max-wait: 50ms

# ================================================================================================
# Configuración propia del motor
# ================================================================================================
centinela:
  aws:
    region: ${AWS_REGION:us-east-1}
    # Vacío en AWS real; apuntado a LocalStack en el perfil 'local' y en los tests.
    endpoint-override: ${AWS_ENDPOINT_OVERRIDE:}
    dynamodb:
      tabla-perfiles: ${TABLA_PERFILES:centinela-perfiles}
      tabla-auditoria: ${TABLA_AUDITORIA:centinela-auditoria}
      # Bandeja de salida (outbox). Vive en su propia tabla y no como atributo de la auditoría
      # porque el relevo consulta un índice disperso sobre ella y la auditoría se retiene siete
      # años: mezclarlas ataría el coste del relevo al histórico completo.
      tabla-bandeja: ${TABLA_BANDEJA:centinela-bandeja-salida}
      # Retención del rastro de auditoría, en días (7 años).
      retencion-auditoria-dias: ${RETENCION_AUDITORIA_DIAS:2555}
    cliente:
      # Ambos por debajo del presupuesto de latencia del motor: si el SDK tardara más, el
      # presupuesto lo cortaría y toda evaluación saldría degradada por diseño.
      timeout-api-call: ${AWS_TIMEOUT_API_CALL:120ms}
      timeout-intento: ${AWS_TIMEOUT_INTENTO:60ms}
      max-reintentos: 2
      max-conexiones: ${AWS_MAX_CONEXIONES:64}

  kafka:
    topics:
      transacciones: ${TOPIC_TRANSACCIONES:fraude.transacciones.v1}
      decisiones: ${TOPIC_DECISIONES:fraude.decisiones.v1}
      # Las transacciones que no se pueden ni deserializar ni evaluar acaban aquí, nunca se
      # descartan: en fraude, un mensaje perdido es una autorización sin control.
      descartes: ${TOPIC_DESCARTES:fraude.transacciones.dlq.v1}
      particiones: ${KAFKA_PARTICIONES:3}
      factor-de-replicacion: ${KAFKA_REPLICAS:1}
    reintentos:
      # Reintentos ADEMÁS de la entrega original. Sólo aplican a fallos transitorios; los
      # mensajes inválidos van directos a la cola de descartes.
      intentos-maximos: 3
      espera-inicial: 200ms
      multiplicador: 2.0
      espera-maxima: 2s
      # Espera del acuse del broker al publicar una decisión. Ya no está en el camino caliente:
      # lo paga el relevo del outbox, no la ventana de autorización.
      timeout-de-publicacion: 5s

  # ------------------------------------------------------------------------------------------
  # Seguridad de la API REST. Clave compartida en la cabecera X-API-KEY.
  #
  # El valor por defecto es de DESARROLLO y está en el repositorio: sirve para levantar el
  # entorno local sin fricción. En application-prod.yml esta propiedad NO tiene defecto, así
  # que un despliegue sin API_KEY no arranca en vez de quedarse abierto.
  # ------------------------------------------------------------------------------------------
  seguridad:
    api-key: ${API_KEY:clave-de-desarrollo-no-usar-en-produccion}
    rutas-publicas:
      # El balanceador consulta la sonda sin credenciales. Si la protegiéramos, el health check
      # daría 401, ECS marcaría la tarea como no sana y la reciclaría en bucle.
      - /actuator/health
      - /actuator/health/**

  motor:
    # Presupuesto total de recolección de contexto. Al agotarse, el motor decide con las
    # señales que ya tiene: llegar tarde a una autorización equivale a no responder.
    presupuesto-latencia: ${MOTOR_PRESUPUESTO_LATENCIA:150ms}
    # Moneda de referencia para perfiles de clientes sin historial.
    moneda-por-defecto: ${MOTOR_MONEDA:EUR}

    # ------------------------------------------------------------------------------------------
    # Relevo de la bandeja de salida (patrón outbox). Kafka no está en el camino caliente:
    # la decisión se asienta con su obligación de publicarse y este relevo la cumple aparte.
    # ------------------------------------------------------------------------------------------
    bandeja:
      tamano-de-lote: ${BANDEJA_LOTE:50}
      intentos-antes-de-alertar: 5
      # Compromiso entre latencia de publicación y presión sobre DynamoDB: cada ciclo es una
      # consulta al índice de pendientes, aunque no haya nada que hacer.
      intervalo-de-relevo: ${BANDEJA_INTERVALO:500ms}
      retraso-inicial: 2s

    # ------------------------------------------------------------------------------------------
    # Política de riesgo. Esto es calibración de negocio, no código: se recalibra cada pocas
    # semanas mirando la tasa de falsos positivos y no puede exigir un despliegue.
    # ------------------------------------------------------------------------------------------
    politica:
      version: ${POLITICA_VERSION:v1-inicial}
      ventana-velocidad: ${POLITICA_VENTANA:60s}
      max-transacciones-por-cliente-en-ventana: ${POLITICA_MAX_TX_CLIENTE:8}
      max-intentos-por-dispositivo-en-ventana: ${POLITICA_MAX_INTENTOS_DISPOSITIVO:6}
      tolerancia-desfase-reloj: 5m
      factor-desviacion-moderada: 5
      factor-desviacion-alta: 10
      factor-desviacion-extrema: 20
      # Pesos por código de regla. Lo que no se declare usa el valor por defecto de la regla.
      aportes: {}

# ================================================================================================
# Observabilidad
# ================================================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      # Muestreo bajo en el flujo caliente; las decisiones de bloqueo se trazan siempre desde
      # el propio adaptador, con independencia de esta probabilidad.
      probability: ${TRACING_SAMPLE_RATE:0.05}
    export:
      otlp:
        # Apagado por defecto A PROPOSITO. El exportador OTLP de Spring Boot viene activo de
        # fabrica y, sin endpoint configurado, cae a http://localhost:4318: un entorno sin
        # colector llenaria el log de errores de conexion cada schedule-delay. Se enciende
        # donde hay algo escuchando (el perfil 'local' lo hace) y en produccion queda a una
        # variable de entorno de distancia el dia que haya un colector.
        enabled: ${OTLP_TRAZAS_HABILITADO:false}

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRAZAS_ENDPOINT:http://localhost:4318/v1/traces}

  otlp:
    metrics:
      export:
        # Las metricas NO salen por OTLP: las recoge Prometheus por scraping de
        # /actuator/prometheus. spring-boot-starter-opentelemetry arrastra
        # micrometer-registry-otlp con el export activo por defecto, asi que hay que apagarlo
        # explicitamente o se empujarian por duplicado a un colector que aqui no existe.
        enabled: false

server:
  shutdown: graceful
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.centinela.fraude: ${LOG_LEVEL_CENTINELA:INFO}
    org.apache.kafka: WARN
    software.amazon.awssdk: WARN
  pattern:
    correlation: "[${spring.application.name},%X{traceId:-},%X{spanId:-}] "
