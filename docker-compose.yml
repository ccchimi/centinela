# =================================================================================================
# Ecosistema completo de Centinela para desarrollo local.
#
#   docker compose up -d                      sólo la infraestructura (Kafka, LocalStack, Redis)
#   docker compose --profile app up -d        además la aplicación nativa
#
# La aplicación está en un perfil de compose aparte a propósito: lo habitual mientras se
# desarrolla es levantar la infraestructura y ejecutar la app desde el IDE.
# =================================================================================================

name: centinela

services:

  # -----------------------------------------------------------------------------------------
  # Kafka en modo KRaft: sin ZooKeeper. La imagen nativa de Apache arranca en un par de
  # segundos, que importa cuando se levanta y se tira el entorno varias veces al día.
  # -----------------------------------------------------------------------------------------
  kafka:
    image: apache/kafka-native:3.9.1
    container_name: centinela-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNO://:19092
      # Dos listeners porque los clientes ven al broker desde sitios distintos: desde el host
      # es localhost:9092 y desde otro contenedor es kafka:19092. Un único advertised listener
      # dejaría fuera a uno de los dos, y el síntoma —conexión inicial correcta seguida de
      # timeouts al producir— es de los que cuestan una tarde.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNO://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      # apache/kafka-native NO trae los scripts de /opt/kafka/bin: es una imagen nativa y sólo
      # lleva el broker. La sonda habitual con kafka-topics.sh falla con "not found" y deja el
      # servicio en unhealthy para siempre, con el broker funcionando perfectamente detrás.
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # -----------------------------------------------------------------------------------------
  # LocalStack simula DynamoDB. El script de init crea las tres tablas y el índice disperso
  # del outbox; sin él la aplicación arrancaría y fallaría en la primera evaluación.
  # -----------------------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:3.8
    container_name: centinela-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: dynamodb
      DEBUG: "0"
      AWS_DEFAULT_REGION: eu-west-1
    volumes:
      - ./infra/localstack/crear-tablas.sh:/etc/localstack/init/ready.d/crear-tablas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb list-tables --region eu-west-1 | grep -q centinela-bandeja-salida"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # -----------------------------------------------------------------------------------------
  # Redis hace de ElastiCache para los contadores de velocidad.
  # -----------------------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: centinela-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -----------------------------------------------------------------------------------------
  # La aplicación, compilada nativa. Perfil 'app' de compose: no se levanta por defecto.
  # -----------------------------------------------------------------------------------------
  centinela:
    build:
      context: .
      target: nativo
    image: centinela:nativo
    container_name: centinela-app
    profiles: ["app"]
    depends_on:
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      # Desde dentro de la red de compose, los servicios se ven por su nombre.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      AWS_REGION: eu-west-1
      # LocalStack acepta cualquier credencial. El SDK las toma de estas variables a través de
      # su cadena por defecto: en AWS real no se ponen y resuelve al rol de la tarea.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL_CENTINELA: DEBUG
      # Ver la nota en application-local.yml: LocalStack no responde en los 120 ms que se
      # esperan de DynamoDB real, y con el valor de producción toda evaluación se degrada.
      AWS_TIMEOUT_API_CALL: 10s
      AWS_TIMEOUT_INTENTO: 5s
      MOTOR_PRESUPUESTO_LATENCIA: 10s
    healthcheck:
      # La imagen nativa no tiene shell ni curl, así que la sonda la hace el propio actuator
      # desde fuera: se comprueba con wget del contenedor de Kafka en el README. Aquí se deja
      # sin healthcheck a propósito en vez de meter utilidades en una imagen distroless.
      disable: true
